<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════ -->

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f2ed;
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --green: #2d6a4f;
    --border: rgba(201,168,76,0.25);
  }

  body.light {
    --black: #f0ece4;
    --white: #1a1713;
    --gold: #9a6f1a;
    --gold-light: #b8870f;
    --border: rgba(154,111,26,0.28);
  }
  body.light::before { opacity: 0.015; }
  body.light .sub { color: rgba(26,23,19,0.6); }
  body.light .note { color: rgba(26,23,19,0.3); }
  body.light .step-text { color: rgba(26,23,19,0.4); }

  html, body {
    height: 100%;
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* noise */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 0;
  }

  /* glow orb */
  body::after {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 24px;
    max-width: 540px;
    width: 100%;
    animation: fadeUp 0.8s ease both;
  }

  .checkmark {
    width: 72px; height: 72px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
    font-size: 32px;
    animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both 0.2s;
    background: rgba(201,168,76,0.06);
  }

  .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 10vw, 80px);
    line-height: 0.95;
    color: var(--white);
    margin-bottom: 24px;
  }

  h1 span { color: var(--gold); }

  p.sub {
    font-size: 16px;
    font-weight: 300;
    color: rgba(245,242,237,0.6);
    line-height: 1.65;
    margin-bottom: 48px;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--gold);
    color: var(--black);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 20px 52px;
    border-radius: 4px;
    text-decoration: none;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .cta-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(201,168,76,0.45);
  }

  .cta-btn:hover::before { opacity: 1; }

  .arrow { font-size: 18px; transition: transform 0.2s; }
  .cta-btn:hover .arrow { transform: translateX(4px); }

  .note {
    margin-top: 20px;
    font-size: 12px;
    color: rgba(245,242,237,0.3);
    letter-spacing: 0.04em;
  }

  .divider {
    width: 48px; height: 1px;
    background: var(--border);
    margin: 48px auto;
  }

  .steps {
    display: flex;
    gap: 32px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex: 0 0 120px;
  }

  .step-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: rgba(201,168,76,0.2);
    line-height: 1;
  }

  .step-icon { font-size: 22px; }

  .step-text {
    font-size: 12px;
    font-weight: 400;
    color: rgba(245,242,237,0.4);
    text-align: center;
    line-height: 1.5;
  }

  body { transition: background 0.35s, color 0.35s; }

  .theme-toggle {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 100;
    background: rgba(201,168,76,0.12);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--gold);
    transition: all 0.25s;
    backdrop-filter: blur(8px);
  }
  .theme-toggle:hover { background: rgba(201,168,76,0.2); }
  .theme-toggle-icon { font-size: 16px; transition: transform 0.4s; }
  body.light .theme-toggle-icon { transform: rotate(180deg); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" title="Switch theme">
  <span class="theme-toggle-icon">🌙</span>
  <span id="theme-label">Dark</span>
</button>

<div class="wrap">
  <div class="checkmark">✓</div>

  <p class="label">You're confirmed</p>

  <h1>One step<br><span>left.</span></h1>

  <p class="sub">
    Tap the button below to connect with our team on Messenger.<br>
    We'll match you with a product and walk you through the process.
  </p>

  <!-- REPLACE href WITH YOUR BOT LINK -->
  <a href="https://m.me/YOUR_PAGE?ref=tester_landing" class="cta-btn" target="_blank">
    Open Messenger
    <span class="arrow">→</span>
  </a>

  <p class="note">Takes 60 seconds · No credit card needed</p>

  <div class="divider"></div>

  <div class="steps">
    <div class="step">
      <span class="step-num">01</span>
      <span class="step-icon">💬</span>
      <span class="step-text">Chat with our team</span>
    </div>
    <div class="step">
      <span class="step-num">02</span>
      <span class="step-icon">📦</span>
      <span class="step-text">Get your product</span>
    </div>
    <div class="step">
      <span class="step-num">03</span>
      <span class="step-icon">💸</span>
      <span class="step-text">Keep it + get paid</span>
    </div>
  </div>
</div>

</body>
<script>
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  document.getElementById('theme-label').textContent = isLight ? 'Light' : 'Dark';
  document.querySelector('.theme-toggle-icon').textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

if (localStorage.getItem('theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('theme-label').textContent = 'Light';
  document.querySelector('.theme-toggle-icon').textContent = '☀️';
}
</script>
</body>
</html>
